{% extends 'core/base.html' %}

{% block title %}Emitir Atestado - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        
        <div class="card shadow-sm border-0">
            <div class="card-header bg-light py-3">
                <h2 class="my-2">Emitir Atestado Médico</h2>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Paciente: <strong>{{ consulta.paciente.get_full_name }}</strong></p>
                <hr>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.periodo_dias.id_for_label }}" class="form-label">{{ form.periodo_dias.label }}:</label>
                            {{ form.periodo_dias }} </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.cid.id_for_label }}" class="form-label">{{ form.cid.label }}:</label>
                            {{ form.cid }} </div>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Salvar Atestado</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <a href="{% url 'cadastrar_anamnese' consulta.id %}">Voltar ao Atendimento</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
