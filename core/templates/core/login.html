<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Clínica Médica</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form > div { margin-bottom: 1em; }
        form label { display: block; }
        .errorlist { color: red; }
    </style>
</head>
<body>
    <h2>Login</h2>
    <p>Acesse seu perfil para marcar consultas.</p>

    {% if form.errors %}
        <div class="errorlist">
            <p>Seu nome de usuário e senha não correspondem. Tente novamente.</p>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div>
            <label for="{{ form.username.id_for_label }}">E-mail ou Nome de Usuário:</label>
            {{ form.username }}
        </div>
        <div>
            <label for="{{ form.password.id_for_label }}">Senha:</label>
            {{ form.password }}
        </div>
        <button type="submit">Entrar</button>
    </form>

    <hr>
    <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se aqui</a>.</p>

</body>
</html>
